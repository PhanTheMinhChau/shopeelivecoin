<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff4d86">
<title>Ghép chữ - Giật lì xì</title>
<style>
:root{--pink:#ed2786;--deep:#8b2438;--cream:#fff3d9;--gold:#ffc66f;--ink:#76283a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#fff1e2}
.hero{height:275px;position:absolute;inset:0 0 auto;background:radial-gradient(ellipse at 50% 0,#ffb7a0 0 18%,transparent 48%),linear-gradient(155deg,#ff7890,#f20d70 55%,#ffb28c);overflow:hidden}
.hero:before{content:"";position:absolute;inset:-70px -30px auto;height:180px;background:radial-gradient(ellipse at 15% 40%,#ffd36f 0 10%,transparent 11%),radial-gradient(ellipse at 35% 10%,#ffd98c 0 12%,transparent 13%),radial-gradient(ellipse at 60% 25%,#ffd07a 0 12%,transparent 13%),radial-gradient(ellipse at 85% 8%,#ffdb91 0 12%,transparent 13%);filter:blur(8px);opacity:.9}
.topbar{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:24px 22px 0;color:white}
.circle{border:0;border-radius:50%;width:48px;height:48px;background:#8b174eaa;color:white;font-size:30px;line-height:1;cursor:pointer}
.heading{position:relative;z-index:1;text-align:center;color:white;font-size:30px;font-weight:800;font-style:italic;text-shadow:0 2px 4px #9a174c;margin-top:-46px;padding-top:0}
main{position:relative;z-index:1;width:min(96%,820px);margin:12px auto 40px}
.frame{background:#fff;border:9px double #ffcf86;border-radius:22px;padding:16px 18px 22px;box-shadow:0 2px 5px #d7a66a55}
.logo{width:132px;height:132px;margin:-120px auto 24px;border:6px solid #fff5df;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px #ffcf86;color:var(--pink);font-size:68px;font-weight:800}
.intro{text-align:center;color:#c98991;font-size:21px;margin:0 0 10px}
.sub{text-align:center;color:#c00050;font-size:25px;font-weight:800;font-style:italic;margin:0 0 16px}
.prize{text-align:center;color:#c00050;font-size:clamp(32px,6vw,54px);font-weight:900;font-style:italic;margin:0 0 12px}
.game{background:var(--cream);border-radius:22px;padding:32px 20px;text-align:center}
h2{font-size:clamp(20px,3.5vw,30px);margin:0 0 24px;color:#792637}
.bank{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 5px;max-width:650px;margin:0 auto 34px}
.letter{width:49px;height:59px;border-radius:15px;background:#ffd09c;border:2px solid white;display:grid;place-items:center;font-size:28px;font-weight:750;color:#792637;box-shadow:0 1px 2px #d8a16c66;transition:.15s}
.letter.used{background:#d8d8d8;color:#999;border-color:#c5c5c5;opacity:.72}
.slashes{font-size:28px;font-weight:700;color:#792637}
.answer-wrap{max-width:620px;margin:0 auto 28px}
.answer{width:100%;border:2px solid #ffc6c9;border-radius:14px;background:#fff;padding:14px 16px;font-size:25px;font-weight:750;letter-spacing:2px;color:#76283a;outline:none;box-shadow:inset 0 2px 5px #00000018}
.answer:focus{border-color:#ed7aa4;box-shadow:0 0 0 3px #ed7aa422}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
button.action{min-width: min(100%,270px);border:3px solid #e4b977;border-radius:18px;padding:13px 28px;background:linear-gradient(#c9c9c9,#a9a9a9);color:white;font-size:27px;font-weight:800;font-style:italic;text-shadow:0 2px 3px #777;box-shadow:0 2px 4px #0002;cursor:pointer}
button.action.copy{background:linear-gradient(#ff6a9d,#e91e73);border-color:#ffd19a}
button.secondary{min-width:120px;background:#fff;border:2px solid #ffc7a0;color:#9a3a50;border-radius:14px;padding:10px 18px;font-weight:700;cursor:pointer}
.note{font-size:13px;color:#a66b70;margin:14px 0 0}
.status{min-height:22px;margin-top:10px;font-size:14px;color:#a22c54}
@media(max-width:480px){main{margin-top:12px}.frame{padding:15px 10px}.game{padding:26px 12px}.letter{width:43px;height:53px;font-size:25px}.slot{width:clamp(38px,11vw,54px);height:54px}.bank{gap:7px 4px}.logo{width:120px;height:120px;margin-top:-112px}.heading{font-size:27px}}
</style>
</head>
<body>
<div class="hero"></div>
<div class="topbar"><button class="circle" aria-label="Quay lại" onclick="resetGame()">‹</button></div>
<main>
 <section class="frame">
  <p class="sub">Bao Chuyển Nhanh</p>
  <section class="game">
   <h2>Ghép thành từ có nghĩa</h2>
   <div class="bank" id="bank" aria-label="Bộ ký tự hiển thị"></div>
   <h2>Đáp án</h2>
   <div class="answer-wrap">
    <input id="answer" class="answer" placeholder="Nhập đáp án tại đây..." autocomplete="off" spellcheck="false" aria-label="Nhập đáp án">
   </div>
   <div class="actions">
    <button class="action copy" id="copy">Copy</button>
    <button class="secondary" id="clear">Xóa đáp án</button>
   </div>
   <div class="status" id="status" role="status"></div>
  </section>
 </section>
</main>
<script>
const answer=document.querySelector('#answer');
const bank=document.querySelector('#bank'), status=document.querySelector('#status');
const params=new URLSearchParams(window.location.search);
const charsetFromUrl=params.get('charset') || params.get('letters') || 'TEST';
const nameUrl=params.get('name') || 'test';
function charsFromBank(){return Array.from(charsetFromUrl.toLocaleUpperCase('vi').replace(/[^A-ZÀ-ỸĐ]/g,''));}
function render(){
 const letters=charsFromBank(), typed=Array.from(answer.value.toLocaleUpperCase('vi').replace(/[^A-ZÀ-ỸĐ]/g,''));
 const used=new Set(); typed.forEach(ch=>{const i=letters.findIndex((x,n)=>x===ch&&!used.has(n));if(i>=0)used.add(i);});
 bank.innerHTML='';
 letters.forEach((ch,i)=>{const el=document.createElement('span');el.className='letter'+(used.has(i)?' used':'');el.textContent=ch;el.title=used.has(i)?'Đã sử dụng':'Chưa sử dụng';bank.append(el);if(i<letters.length-1){const slash=document.createElement('span');slash.className='slashes';slash.textContent='/';bank.append(slash);}});
}
answer.addEventListener('input',()=>{render();status.textContent='';});
document.querySelector('.sub').textContent = nameUrl;
document.querySelector('#clear').addEventListener('click',()=>{answer.value='';render();answer.focus();status.textContent='Đã xóa đáp án.';});
document.querySelector('#copy').addEventListener('click',async()=>{const value=answer.value.trim();if(!value){status.textContent='Bạn chưa nhập đáp án.';answer.focus();return;}try{await navigator.clipboard.writeText(value);status.textContent='Đã sao chép: '+value;}catch(e){answer.select();document.execCommand('copy');status.textContent='Đã sao chép: '+value;}});
function resetGame(){answer.value='';render();status.textContent='';}
async function sharePage(){try{await navigator.share({title:'Ghép chữ',url:location.href});}catch(e){}}
render();
</script>
</body>
</html>
