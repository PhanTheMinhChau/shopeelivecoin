
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%}body{font-family:Arial;background:#f5f5f5;overflow:hidden}
header{height:56px;display:flex;align-items:center;padding:0 16px;background:#fff}
#app{height:calc(100vh - 56px);overflow:auto}#gallery{display:flex;gap:16px;padding:16px;align-items:flex-start}.col{flex:1;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0002;cursor:pointer}.card img{display:block;width:100%;height:auto}
.modal{display:none;position:fixed;inset:0;background:#000d;justify-content:center;align-items:center}.modal.show{display:flex}
.modal img{max-width:95vw;max-height:90vh}.close{position:absolute;top:18px;right:22px;font-size:40px;color:#fff;cursor:pointer;font-weight:bold;user-select:none}
</style></head><body><header><b>Gallery</b></header><div id=app><div id=gallery></div></div>
<div id=modal class=modal><div class=close id=close>&times;</div><img id=full></div>
<script>
const API="https://shopeelivecoin-shopeepay.vercel.app/adc";
const gallery=document.getElementById("gallery"),app=document.getElementById("app"),modal=document.getElementById("modal"),full=document.getElementById("full"),closeBtn=document.getElementById("close");
let cols=[],heights=[],imgs=[],idx=0,PAGE=40,current=-1;
function makeCols(){gallery.innerHTML="";cols=[];heights=[];let n=innerWidth<600?2:innerWidth<1000?3:4;for(let i=0;i<n;i++){let d=document.createElement("div");d.className="col";gallery.appendChild(d);cols.push(d);heights.push(0);}}
makeCols();fetch(API).then(r=>r.json()).then(d=>{imgs=d;more();});
function show(i){if(i<0||i>=imgs.length)return;current=i;full.src=imgs[i].url;modal.classList.add("show");if(i>imgs.length-PAGE/2)more();}
function add(it,i){let t=heights.indexOf(Math.min(...heights));let c=document.createElement("div");c.className="card";c.innerHTML='<img loading="lazy" src="'+it.url+'">';cols[t].appendChild(c);heights[t]+=(cols[t].clientWidth||300)*((it.height||1)/(it.width||1))+16;c.onclick=()=>show(i);}
function more(){let e=Math.min(idx+PAGE,imgs.length);while(idx<e){add(imgs[idx],idx);idx++;}}
app.onscroll=()=>{if(app.scrollTop+app.clientHeight>app.scrollHeight-500)more();};
closeBtn.onclick=()=>modal.classList.remove("show");
modal.onclick=e=>{if(e.target===modal)modal.classList.remove("show");};
let sx=0;
full.addEventListener("touchstart",e=>sx=e.touches[0].clientX);
full.addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){if(dx<0)show(current+1);else show(current-1);}});
document.addEventListener("keydown",e=>{if(!modal.classList.contains("show"))return;if(e.key==="Escape")modal.classList.remove("show");if(e.key==="ArrowRight")show(current+1);if(e.key==="ArrowLeft")show(current-1);});
</script></body></html>
