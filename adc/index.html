<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gallery</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f6fb}
header{position:sticky;top:0;background:#fff;padding:16px 20px;box-shadow:0 2px 10px rgba(0,0,0,.08);display:flex;justify-content:space-between}
#gallery{column-count:5;column-gap:16px;padding:16px}
@media(max-width:1200px){#gallery{column-count:4}}
@media(max-width:900px){#gallery{column-count:3}}
@media(max-width:600px){#gallery{column-count:2}}
.card{display:inline-block;width:100%;margin:0 0 16px;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.1);cursor:pointer;break-inside:avoid}
.card img{display:block;width:100%;height:auto;transition:.25s}.card:hover img{transform:scale(1.03)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);justify-content:center;align-items:center}
.modal.show{display:flex}.modal img{max-width:95vw;max-height:90vh}
.close,.nav{position:absolute;color:#fff;font-size:42px;cursor:pointer;user-select:none}
.close{top:15px;right:25px}.nav{top:50%;transform:translateY(-50%);padding:10px}.prev{left:20px}.next{right:20px}
</style></head><body>
<div id="count">0 ảnh</div>
<div id="gallery"></div>
<div class="modal" id="modal"><div class="close" id="close">&times;</div><div class="nav prev" id="prev">&#10094;</div><img id="full"><div class="nav next" id="next">&#10095;</div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbzwrexZCJR85WDJKaW0R6H1-juIWdzYBWrLeIa3whLIHxWBdwoqLXzCJF2qhfWKDEm_/exec";
let images=[],current=0;
const g=gallery,m=modal,f=full;
fetch(API).then(r=>r.json()).then(d=>{
images=d;count.textContent=d.length+" ảnh";
d.forEach((x,i)=>{const c=document.createElement("div");c.className="card";c.innerHTML=`<img loading="lazy" src="${x.url}">`;c.onclick=()=>openImg(i);g.appendChild(c);});
});
function openImg(i){current=i;f.src=images[i].url;m.classList.add("show");document.body.style.overflow="hidden";}
function show(o){current=(current+o+images.length)%images.length;openImg(current);}
close.onclick=()=>{m.classList.remove("show");document.body.style.overflow=""}
prev.onclick=e=>{e.stopPropagation();show(-1)}
next.onclick=e=>{e.stopPropagation();show(1)}
m.onclick=e=>{if(e.target===m)close.click()}
document.addEventListener("keydown",e=>{if(!m.classList.contains("show"))return;if(e.key=="Escape")close.click();if(e.key=="ArrowLeft")show(-1);if(e.key=="ArrowRight")show(1);});
</script></body></html>
