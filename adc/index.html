<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
#loading{position:fixed;inset:0;background:#fff;display:flex;justify-content:center;align-items:center;z-index:9999;transition:.25s}
#loading.hide{opacity:0;pointer-events:none}
.spinner{width:52px;height:52px;border:5px solid #ddd;border-top-color:#2196f3;border-radius:50%;animation:spin .8s linear infinite}
#imgLoading{position:absolute;inset:0;display:none;justify-content:center;align-items:center}
#imgLoading.show{display:flex}
@keyframes spin{to{transform:rotate(360deg)}}
html,body{margin:0;height:100%}body{font-family:Arial;background:#f5f5f5;overflow:hidden}header{height:56px;display:flex;align-items:center;padding:0 16px;background:#fff}#app{height:calc(100vh - 56px);overflow:auto}#gallery{display:flex;gap:8px;padding:16px 8px;align-items:flex-start}.col{flex:1;display:flex;flex-direction:column;gap:10px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0002;cursor:pointer}.card img{display:block;width:100%;height:auto}.modal{display:none;position:fixed;inset:0;background:#000d;justify-content:center;align-items:center}.modal.show{display:flex}.modal img{max-width:95vw;max-height:90vh}.close{position:absolute;top:18px;right:22px;font-size:40px;color:#fff;cursor:pointer}</style></head><body><div id="loading"><div class="spinner"></div></div><header><b style="color: #9b4646;">19.07 NHẬT TIẾN & NGỌC ÁNH</b></header><div id=app><div id=gallery></div></div><div id=modal class=modal><div id=close class=close>&times;</div><div id="imgLoading"><div class="spinner"></div></div><img id=full style="opacity:0;transition:.2s"></div><script>
const API="https://shopeelivecoin-shopeepay.vercel.app/adc";
const gallery=document.getElementById("gallery"),app=document.getElementById("app"),modal=document.getElementById("modal"),full=document.getElementById("full"),closeBtn=document.getElementById("close"),loading=document.getElementById("loading"),imgLoading=document.getElementById("imgLoading");
let cols=[],heights=[],imgs=[],idx=0,PAGE=40,current=-1;
function makeCols(){gallery.innerHTML="";cols=[];heights=[];let n=innerWidth<600?2:innerWidth<1000?3:4;for(let i=0;i<n;i++){let d=document.createElement("div");d.className="col";gallery.appendChild(d);cols.push(d);heights.push(0);}}makeCols();
fetch(API).then(r=>r.json()).then(d=>{imgs=d;more()}).finally(()=>loading.classList.add("hide"));
function show(i){if(i<0||i>=imgs.length)return;current=i;imgLoading.classList.add("show");full.style.opacity=0;full.onload=()=>{imgLoading.classList.remove("show");full.style.opacity=1};full.src=imgs[i].url;modal.classList.add("show");if(i>imgs.length-PAGE/2)more();}
function add(it,i){let t=heights.indexOf(Math.min(...heights));let c=document.createElement("div");c.className="card";c.innerHTML='<img loading="lazy" src="'+it.url+'">';cols[t].appendChild(c);heights[t]+=(cols[t].clientWidth||300)*((it.height||1)/(it.width||1))+16;c.onclick=()=>show(i)}
function more(){let e=Math.min(idx+PAGE,imgs.length);while(idx<e){add(imgs[idx],idx);idx++;}}
app.onscroll=()=>{if(app.scrollTop+app.clientHeight>app.scrollHeight-500)more()};closeBtn.onclick=()=>modal.classList.remove("show");modal.onclick=e=>{if(e.target===modal)modal.classList.remove("show")}
let sx=0,touching=false,zooming=false;
full.addEventListener("touchstart",e=>{if(e.touches.length>1){zooming=true;touching=false;return;}zooming=false;touching=true;sx=e.touches[0].clientX;},{passive:true});
full.addEventListener("touchend",e=>{if(!touching||zooming)return;let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60){dx<0?show(current+1):show(current-1)}touching=false;},{passive:true});
document.addEventListener("keydown",e=>{if(!modal.classList.contains("show"))return;if(e.key==="Escape")modal.classList.remove("show");if(e.key==="ArrowRight")show(current+1);if(e.key==="ArrowLeft")show(current-1);});
</script></body></html>
