<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Arial;background:#f5f5f5}
header{height:56px;display:flex;align-items:center;padding:0 16px;background:#fff;box-shadow:0 2px 8px #0002}
#app{height:calc(100vh - 56px);overflow-y:auto}
#gallery{column-count:2;column-gap:16px;padding:16px}
@media(min-width:600px){#gallery{column-count:3}}
@media(min-width:1000px){#gallery{column-count:4}}
.card{display:inline-block;width:100%;margin:0 0 16px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0002;break-inside:avoid;cursor:pointer}
.card img{width:100%;display:block}
#loading{text-align:center;padding:20px}
.spin{width:30px;height:30px;border:4px solid #ddd;border-top-color:#09f;border-radius:50%;margin:auto;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.modal{display:none;position:fixed;inset:0;background:#000d;justify-content:center;align-items:center}
.modal.show{display:flex}.modal img{max-width:95vw;max-height:90vh}
.btn{position:absolute;color:#fff;font-size:40px;cursor:pointer;user-select:none}
.x{top:10px;right:20px}.l{left:20px;top:50%}.rr{right:20px;top:50%}
</style></head><body>
<header><b>Gallery</b></header>
<div id="app"><div id="loading"><div class="spin"></div></div><div id="gallery"></div></div>
<div id="modal" class="modal"><div id="closeBtn" class="btn x">&times;</div><div id="prev" class="btn l">&#10094;</div><img id="full"><div id="next" class="btn rr">&#10095;</div></div>
<script>
const API="https://shopeelivecoin-shopeepay.vercel.app/adc";
const gallery=document.getElementById("gallery"),loading=document.getElementById("loading");
const modal=document.getElementById("modal"),full=document.getElementById("full");
let imgs=[],idx=0,cur=0,PAGE=40;
fetch(API).then(r=>r.json()).then(d=>{imgs=d;loading.remove();more();});
function more(){
 let end=Math.min(idx+PAGE,imgs.length);
 for(;idx<end;idx++){
   let c=document.createElement("div");
   c.className="card";
   let i=idx;
   c.innerHTML=`<img loading="lazy" src="${imgs[i].url}">`;
   c.onclick=()=>{cur=i;full.src=imgs[i].url;modal.classList.add("show");};
   gallery.appendChild(c);
 }
}
document.getElementById("app").addEventListener("scroll",e=>{
 const a=e.currentTarget;
 if(a.scrollTop+a.clientHeight>a.scrollHeight-500)more();
});
closeBtn.onclick=()=>modal.classList.remove("show");
modal.onclick=e=>{if(e.target===modal)modal.classList.remove("show")}
prev.onclick=()=>{cur=(cur-1+imgs.length)%imgs.length;full.src=imgs[cur].url}
next.onclick=()=>{cur=(cur+1)%imgs.length;full.src=imgs[cur].url}
</script></body></html>
